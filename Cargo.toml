[package]
name = "naantree"
version = "0.1.0"
edition = "2021"

[lib]
name = "naantree"
path = "src/lib.rs"

[[bin]]
name = "naantree"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
uuid = { version = "1.28.0", features = ["v4"] }
